<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabecalho('Trechos')}"></head>
<body>
<header th:replace="~{fragmentos/layout :: topo('Trechos de calçada', 'Larguras, inclinação e índice de acessibilidade de cada trecho monitorado.')}"></header>
<nav th:replace="~{fragmentos/layout :: menu('trechos')}"></nav>

<main class="container">
    <div class="alerta alerta-sucesso" role="status" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alerta alerta-erro" role="alert" th:if="${erro}" th:text="${erro}"></div>

    <p class="vazio" th:if="${#lists.isEmpty(trechos)}">Nenhum trecho cadastrado no momento.</p>

    <div class="tabela-rolagem" th:unless="${#lists.isEmpty(trechos)}">
        <table class="tabela">
            <thead>
            <tr>
                <th scope="col">Rua</th>
                <th scope="col">Comprimento</th>
                <th scope="col">Largura livre</th>
                <th scope="col">Inclinação</th>
                <th scope="col">Índice</th>
                <th scope="col">Barreiras</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${trechos}">
                <td th:text="${t.nmRua}">Rua</td>
                <td class="num" th:text="${t.nrComprimentoM} + ' m'">0 m</td>
                <td class="num" th:text="${#numbers.formatDecimal(t.nrLarguraLivreM, 1, 2)} + ' m'">0,00 m</td>
                <td class="num" th:text="${#numbers.formatDecimal(t.nrInclinacaoPct, 1, 1)} + '%'">0,0%</td>
                <td>
                    <span class="indice"
                          th:classappend="${t.nrIndiceAcessibilidade >= 7 ? 'indice-bom' :
                                          (t.nrIndiceAcessibilidade >= 4 ? 'indice-medio' : 'indice-ruim')}">
                        <span th:text="${t.nrIndiceAcessibilidade >= 7 ? '✓' :
                                        (t.nrIndiceAcessibilidade >= 4 ? '!' : '✕')}" aria-hidden="true">✓</span>
                        <span th:text="${#numbers.formatDecimal(t.nrIndiceAcessibilidade, 1, 1)}">0,0</span>
                    </span>
                </td>
                <td>
                    <span class="etiqueta"
                          th:classappend="${barreirasPorTrecho.getOrDefault(t.idTrecho, 0) > 0} ? 'etiqueta-alerta' : 'etiqueta-ok'"
                          th:text="${barreirasPorTrecho.getOrDefault(t.idTrecho, 0)}">0</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragmentos/layout :: rodape}"></footer>
</body>
</html>
