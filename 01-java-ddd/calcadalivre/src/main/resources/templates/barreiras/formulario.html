<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabecalho('Nova barreira')}"></head>
<body>
<header th:replace="~{fragmentos/layout :: topo('Registrar barreira', 'Informe o trecho, o tipo de barreira e a gravidade observada. Leva menos de 30 segundos.')}"></header>
<nav th:replace="~{fragmentos/layout :: menu('barreira')}"></nav>

<main class="container">
    <div class="alerta alerta-erro" role="alert" th:if="${erro}" th:text="${erro}"></div>
    <div class="alerta alerta-sucesso" role="status" th:if="${sucesso}" th:text="${sucesso}"></div>

    <form class="formulario" th:action="@{/barreiras/salvar}" method="post">
        <div class="campo">
            <label for="idTrecho">Trecho</label>
            <select id="idTrecho" name="idTrecho" required>
                <option th:each="t : ${trechos}"
                        th:value="${t.idTrecho}"
                        th:text="${t.nmRua}"
                        th:selected="${registroBarreira.idTrecho == t.idTrecho}">Rua</option>
            </select>
        </div>

        <fieldset class="passo">
            <legend><span class="passo-num" aria-hidden="true">1</span>Qual é a barreira?</legend>
            <div class="opcoes opcoes-tipo">
                <label class="opcao" th:each="tipo : ${tipos}">
                    <input type="radio" name="idTipoBarreira" required
                           th:value="${tipo.idTipoBarreira}"
                           th:checked="${registroBarreira.idTipoBarreira == tipo.idTipoBarreira
                                         or (registroBarreira.idTipoBarreira == 0 and tipoStat.first)}">
                    <span class="opcao-visual" th:classappend="${tipo.nrGravidadeBase >= 4} ? 'grave'">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>
                        <span th:text="${tipo.dsTipoBarreira}">Tipo</span>
                    </span>
                </label>
            </div>
        </fieldset>

        <fieldset class="passo">
            <legend><span class="passo-num" aria-hidden="true">2</span>Gravidade</legend>
            <div class="opcoes opcoes-gravidade">
                <label class="opcao" th:each="g : ${#numbers.sequence(1, 5)}">
                    <input type="radio" name="nrGravidade" required th:value="${g}"
                           th:checked="${(registroBarreira.nrGravidade == 0 ? 3 : registroBarreira.nrGravidade) == g}">
                    <span class="opcao-visual opcao-grav" th:text="${g}">1</span>
                </label>
            </div>
            <div class="escala"><span>1 · incômodo</span><span>5 · intransitável</span></div>
        </fieldset>

        <div class="campo">
            <label for="idUsuario"><span class="passo-num" aria-hidden="true">3</span>Quem está registrando?</label>
            <select id="idUsuario" name="idUsuario" required>
                <option th:each="u : ${usuarios}"
                        th:value="${u.idUsuario}"
                        th:text="${u.nmUsuario}"
                        th:selected="${registroBarreira.idUsuario == u.idUsuario}">Usuário</option>
            </select>
        </div>

        <div class="campo">
            <label for="dsRegistro">Descrição <span class="opcional">(opcional)</span></label>
            <textarea id="dsRegistro" name="dsRegistro" rows="4"
                      placeholder="Ex.: bueiro sem tampa ocupando metade da calçada"
                      th:text="${registroBarreira.dsRegistro}"></textarea>
        </div>

        <div class="campo-duplo">
            <div class="campo">
                <label for="nrLatitude">Latitude <span class="opcional">(opcional)</span></label>
                <input id="nrLatitude" name="nrLatitude" type="number" step="any" placeholder="-23.5505">
            </div>
            <div class="campo">
                <label for="nrLongitude">Longitude <span class="opcional">(opcional)</span></label>
                <input id="nrLongitude" name="nrLongitude" type="number" step="any" placeholder="-46.6333">
            </div>
        </div>

        <div class="acoes">
            <button class="botao botao-primario" type="submit">Enviar alerta para a comunidade</button>
            <a class="botao botao-neutro" th:href="@{/}">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragmentos/layout :: rodape}"></footer>
</body>
</html>
