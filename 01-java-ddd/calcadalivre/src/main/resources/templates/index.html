<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabecalho('Painel')}"></head>
<body>
<header th:replace="~{fragmentos/layout :: topo('Painel de acessibilidade das calçadas', 'Trechos mapeados, barreiras reportadas e prioridade de manutenção por tipo de via.')}"></header>
<nav th:replace="~{fragmentos/layout :: menu('painel')}"></nav>

<main class="container">
    <div class="alerta alerta-sucesso" role="status" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alerta alerta-erro" role="alert" th:if="${erro}" th:text="${erro}"></div>

    <section class="indicadores" aria-label="Indicadores">
        <article class="cartao cartao-rota">
            <span class="rotulo">Trechos mapeados</span>
            <strong th:text="${totalTrechos}">0</strong>
        </article>
        <article class="cartao cartao-barreira">
            <span class="rotulo">Barreiras registradas</span>
            <strong th:text="${totalBarreiras}">0</strong>
        </article>
    </section>

    <section class="bloco">
        <div class="bloco-topo">
            <h2>Trechos monitorados</h2>
            <a class="botao botao-primario" th:href="@{/barreiras/nova}">Reportar barreira</a>
        </div>

        <p class="vazio" th:if="${#lists.isEmpty(trechos)}">Nenhum trecho cadastrado no momento.</p>

        <ul class="lista" th:unless="${#lists.isEmpty(trechos)}">
            <li class="item" th:each="t : ${trechos}">
                <div class="item-info">
                    <span class="item-titulo" th:text="${t.nmRua}">Rua</span>
                    <span class="item-detalhe">
                        Índice de acessibilidade
                        <span class="indice"
                              th:classappend="${t.nrIndiceAcessibilidade >= 7 ? 'indice-bom' :
                                              (t.nrIndiceAcessibilidade >= 4 ? 'indice-medio' : 'indice-ruim')}">
                            <span th:text="${t.nrIndiceAcessibilidade >= 7 ? '✓' :
                                            (t.nrIndiceAcessibilidade >= 4 ? '!' : '✕')}" aria-hidden="true">✓</span>
                            <span th:text="${#numbers.formatDecimal(t.nrIndiceAcessibilidade, 1, 1)}">0,0</span>
                        </span>
                    </span>
                    <span class="indice-barra" aria-hidden="true">
                        <span th:classappend="${t.nrIndiceAcessibilidade >= 7 ? 'bom' :
                                               (t.nrIndiceAcessibilidade >= 4 ? 'medio' : 'ruim')}"
                              th:style="'width:' + ${#numbers.formatDecimal(t.nrIndiceAcessibilidade * 10, 1, 0, 'POINT')} + '%'"></span>
                    </span>
                </div>
                <span class="etiqueta"
                      th:classappend="${barreirasPorTrecho.getOrDefault(t.idTrecho, 0) > 0} ? 'etiqueta-alerta' : 'etiqueta-ok'"
                      th:text="${barreirasPorTrecho.getOrDefault(t.idTrecho, 0)} + ' barreira(s)'">0 barreira(s)</span>
            </li>
        </ul>

        <a class="link" th:href="@{/trechos}">Ver todos os trechos em detalhe</a>
    </section>
</main>

<footer th:replace="~{fragmentos/layout :: rodape}"></footer>
</body>
</html>
