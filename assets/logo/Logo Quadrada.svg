<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ícone CalçadaLivre">
  <defs>
    <clipPath id="squircle">
      <rect x="16" y="16" width="480" height="480" rx="112" />
    </clipPath>
  </defs>

  <!-- Fundo Azul Calçada Profundo -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#0B2545" />

  <g clip-path="url(#squircle)">
    <!-- Brilho circular de contraste -->
    <circle cx="400" cy="110" r="210" fill="#133B6E" opacity="0.6" />

    <!-- Sombra da Rampa Acessível -->
    <path d="M -20 512 C 95 415, 175 315, 315 250 L 520 315 L 520 512 Z" fill="#007A4C" />

    <!-- Superfície da Calçada / Rampa Livre (Verde Rota Livre) -->
    <path d="M 20 505 C 125 385, 210 290, 345 220 L 475 282 C 325 350, 255 420, 190 505 Z" fill="#00A86B" />

    <!-- Guia Rebaixada Branca (Alto Contraste) -->
    <path d="M 16 500 C 120 380, 206 286, 345 220" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />

    <!-- Faixa Central de Piso Tátil Direcional (Amarelo Piso Tátil) -->
    <path d="M 98 490 C 180 392, 255 312, 372 254" fill="none" stroke="#FFB703" stroke-width="18" stroke-linecap="round" stroke-dasharray="36 28" />

    <!-- Matriz de Piso Tátil de Alerta (Canto Superior Esquerdo) -->
    <g fill="#FFB703">
      <circle cx="104" cy="112" r="13" />
      <circle cx="152" cy="112" r="13" />
      <circle cx="200" cy="112" r="13" />
      <circle cx="104" cy="160" r="13" />
      <circle cx="152" cy="160" r="13" />
      <circle cx="200" cy="160" r="13" />
      <circle cx="104" cy="208" r="13" opacity="0.65" />
      <circle cx="152" cy="208" r="13" opacity="0.65" />
    </g>
  </g>

  <!-- Pino de Localização & Acessibilidade Validada -->
  <g transform="translate(262, 54)">
    <circle cx="86" cy="82" r="76" fill="#FFB703" opacity="0.22" />
    <path d="M 86 8 C 43 8, 8 43, 8 86 C 8 139, 86 208, 86 208 C 86 208, 164 139, 164 86 C 164 43, 129 8, 86 8 Z" fill="#FFFFFF" stroke="#0B2545" stroke-width="10" stroke-linejoin="round" />
    <circle cx="86" cy="84" r="48" fill="#00A86B" />
    <path d="M 64 85 L 79 100 L 110 69" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Moldura Externa Amarelo Piso Tátil -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#FFB703" stroke-width="10" />
</svg>